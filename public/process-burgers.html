<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Remoção de Fundo dos Hambúrgueres</title>
  <style>
    body { font-family: sans-serif; background: #12080a; color: #fff; padding: 24px; text-align: center; }
    .status { margin: 15px auto; max-width: 600px; padding: 14px; border-radius: 8px; background: #221013; border: 1px solid #ffcc0033; font-family: monospace; font-size: 14px; }
    .preview { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 30px; }
    .card { background: #1c0d10; border: 1px solid #ffcc0044; border-radius: 12px; padding: 15px; width: 220px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    .card img { width: 100%; height: 160px; object-fit: contain; background: repeating-conic-gradient(#2b1619 0% 25%, #180b0d 0% 50%) 50% / 20px 20px; border-radius: 8px; }
    .card strong { display: block; margin-top: 10px; color: #ffc955; }
  </style>
</head>
<body>
  <h1 style="color: #ffc955;">Processador IA: Remoção de Fundo dos Hambúrgueres</h1>
  <div id="status" class="status">Carregando IA (@imgly/background-removal)...</div>
  <div id="progress" class="status">Aguardando início...</div>
  <div class="preview" id="preview"></div>

  <script type="module">
    import { removeBackground } from 'https://cdn.jsdelivr.net/npm/@imgly/background-removal/+esm';

    const burgers = [
      { id: "tia-penha", name: "TIA PENHA", url: "https://static.saipos.com/saipos-estatico/img-items/87707/store_item/d44d7a591b303e38ad1bef5b28d499d5.png" },
      { id: "cheddar-bacon", name: "CHEDDAR BACON", url: "https://static.saipos.com/saipos-estatico/img-items/87707/store_item/04a2bf0b6d090f5ad558f5a534ecff69.png" },
      { id: "duplo-bacon", name: "DUPLO BACON", url: "https://static.saipos.com/saipos-estatico/img-items/87707/store_item/2fc0a13246cb73b9081d5060cc4f9775.png" },
      { id: "gorgonzola-special", name: "GORGONZOLA SPECIAL", url: "https://static.saipos.com/saipos-estatico/img-items/87707/store_item/6fca673afb4f6cba8cae79d86b475b58.png" },
      { id: "trufado", name: "TRUFADO", url: "https://static.saipos.com/saipos-estatico/img-items/87707/store_item/848f36dee9c6694f4f00a96d1aff653a.png" },
      { id: "sabara", name: "SABARÁ", url: "https://static.saipos.com/saipos-estatico/img-items/87707/store_item/b484eab37fd9de5545f712b80153cf35.png" }
    ];

    const statusEl = document.getElementById("status");
    const progressEl = document.getElementById("progress");
    const previewEl = document.getElementById("preview");

    async function blobToDataUrl(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    async function start() {
      try {
        statusEl.textContent = "IA pronta! Iniciando recorte das imagens...";
        let count = 0;

        for (const burger of burgers) {
          count++;
          progressEl.textContent = `[${count}/${burgers.length}] Baixando ${burger.name}...`;
          
          const proxyUrl = `/api/proxy-image?url=${encodeURIComponent(burger.url)}`;
          const imgRes = await fetch(proxyUrl);
          const imgBlob = await imgRes.blob();

          progressEl.textContent = `[${count}/${burgers.length}] Recortando ${burger.name} com IA...`;
          
          const resultBlob = await removeBackground(imgBlob, {
            progress: (key, current, total) => {
              const pct = total ? Math.round((current / total) * 100) : "";
              progressEl.textContent = `[${count}/${burgers.length}] ${burger.name}: ${key} ${pct ? pct + '%' : ''}`;
            }
          });

          progressEl.textContent = `[${count}/${burgers.length}] Salvando imagem recortada de ${burger.name}...`;
          const dataUrl = await blobToDataUrl(resultBlob);

          const saveRes = await fetch("/api/save-burger", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: burger.id, dataUrl })
          });
          const saveData = await saveRes.json();
          console.log("Salvo:", saveData);

          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `<img src="${dataUrl}" alt="${burger.name}" /><strong>${burger.name}</strong><span style="color:#4ade80;font-size:12px">✓ Fundo Removido</span>`;
          previewEl.appendChild(card);
        }

        statusEl.innerHTML = '<span style="color:#4ade80; font-weight:bold; font-size:16px">✓ SUCESSO: Todos os hambúrgueres recortados e salvos!</span>';
        progressEl.textContent = "Concluído!";
        window.__ALL_DONE__ = true;
      } catch (err) {
        console.error(err);
        statusEl.innerHTML = `<span style="color:#ef4444">Erro: ${err.message}</span>`;
        progressEl.textContent = "Falha no processamento. Veja o console.";
      }
    }

    start();
  </script>
</body>
</html>
